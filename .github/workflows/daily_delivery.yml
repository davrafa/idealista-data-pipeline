name: Idealista Daily Pipeline

on:
  schedule:
    # Corre todos os dias às 08:30 da manhã (hora UTC)
    - cron: '30 8 * * *'
  workflow_dispatch: # Permite-te correr manualmente no botão do site do GitHub

jobs:
  extract-and-delivery:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: data_engineer
          POSTGRES_PASSWORD: secretpassword123
          POSTGRES_DB: realestate_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Correr o Extrator de Dados (Pipeline)
        run: python src/pipeline.py

      - name: Correr o Upload para a AWS S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python src/upload.py